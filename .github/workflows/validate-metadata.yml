name: Validate metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test validator
        run: node --test scripts/*.test.mjs
      - name: Validate Data Package
        run: node scripts/validate-datapackage.mjs
